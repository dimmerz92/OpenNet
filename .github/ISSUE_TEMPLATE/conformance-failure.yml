name: Conformance failure
description: Report disagreement between an implementation, test, and specification.
title: "[Conformance]: "
labels: ["conformance"]
body:
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
    validations:
      required: true
  - type: input
    id: implementation
    attributes:
      label: Implementation and version
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input or test vector
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour and specification basis
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction instructions
    validations:
      required: true
