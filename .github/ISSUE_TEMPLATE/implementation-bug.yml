name: Implementation bug
description: Report a defect in the reference implementation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component or layer
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
  - type: textarea
    id: description
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction instructions
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Platform, build, and configuration
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, interoperability, or operational impact
